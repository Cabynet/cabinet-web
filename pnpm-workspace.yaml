packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@nestjs/core': set this to true or false
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  argon2: true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@tanstack/form-core@1.33.2'
  - '@tanstack/react-form@1.33.2'
  - postcss@8.5.18
